<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Our day"><meta name="theme-color" content="#163d68"><title>Our day · Family dashboard</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head>
<body><main id="dashboard"><header><div><div class="eyebrow">OUR FAMILY • OUR DAY</div><h1 id="date">Welcome home</h1></div><div class="clock" id="clock" aria-label="Current time"></div></header>
<section class="quote" aria-label="Quote of the day"><span class="eyebrow">A LITTLE INSPIRATION</span><p id="quote"></p><span id="quote-source"></span></section>
<section class="tasks"><div class="section-heading"><h2>Today's tasks</h2><span id="progress" aria-live="polite"></span></div><div class="columns"><section class="person"><h3><span class="initial" id="initial-person1">1</span> <span id="name-person1">Child 1</span></h3><div id="person1"></div></section><section class="person second"><h3><span class="initial" id="initial-person2">2</span> <span id="name-person2">Child 2</span></h3><div id="person2"></div></section></div></section>
<section class="week-section"><div class="section-heading"><h2>Week at a glance</h2><span id="week-range"></span></div><div id="week" class="week"></div></section>
<footer><span id="save-status" role="status">Saved on this iPad</span><nav aria-label="Family tools"><button data-panel="meals">Meals</button><button data-panel="grocery">Grocery</button><button data-panel="more">More <span aria-hidden="true">···</span></button></nav></footer></main>
<div id="overlay" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="section-heading"><h2 id="panel-title"></h2><button id="close" aria-label="Close panel">Close</button></div><div id="panel-body"></div></section></div>
<noscript>This dashboard needs JavaScript enabled in Safari Settings.</noscript><script src="data.js"></script><script src="app.js"></script></body></html>
